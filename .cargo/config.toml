# Офлайн-режим макросов sqlx — умолчание репозитория.
#
# Без него макросы `query!` предпочитают живое описание схемы кэшу `.sqlx`,
# когда виден DATABASE_URL. Разработчик с локальной базой поэтому не замечает
# расхождения кэша, и ловит его только CI. С этой строкой локальная сборка
# ведёт себя так же, как сборка агента без базы и как job в CI.
#
# --- force = true здесь НЕ ставится ----------------------------------------
# `cargo sqlx prepare` сам выставляет дочернему процессу SQLX_OFFLINE=false,
# и значение из [env] без `force` ему уступает — именно это и нужно.
#
# С `force = true` конфиг перебил бы sqlx-cli, prepare ушёл бы в офлайн и
# `prepare --check` начал бы сверять кэш сам с собой: зелёный всегда, включая
# случай изменившейся схемы, ради которого он и заведён. Сторож, потерявший
# способность краснеть, — ровно то, что запрещает
# docs/solutions/best-practices/storozh-obyazan-krasnet.md
[env]
SQLX_OFFLINE = "true"
