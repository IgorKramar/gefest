name: CI

# Никаких paths-фильтров на уровне workflow: отфильтрованный здесь job
# никогда не рапортует статус, и PR с required check застревает навсегда в
# ожидании. Фильтрация выполняется ВНУТРИ каждого job-а (ADR-0014).
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # Обязательно и неочевидно: явный блок permissions обнуляет все
  # неперечисленные области, а dorny/paths-filter на событии pull_request
  # работает не через git, а запросом REST API к списку файлов PR. Без этого
  # права шаг падает — и падают все пять job-ов на каждом PR.
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # `mise run` по умолчанию доустанавливает недостающие инструменты активного
  # конфига перед запуском задачи — то есть install_args: rust ниже сам по
  # себе НЕ спасает от сборки sqlx-cli из исходников. Без этой настройки
  # первый же `mise run` тянет cargo:sqlx-cli, и заявленная экономия
  # supply-chain-поверхности остаётся только в комментарии.
  # Локальная работа не затронута: там автоустановка удобна и остаётся.
  MISE_TASK_RUN_AUTO_INSTALL: 'false'

jobs:
  rust:
    name: rust
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Нужна на событии push, где фильтрация идёт по git.
          fetch-depth: 0
          # Ни один шаг после checkout не обращается к API от имени токена.
          persist-credentials: false

      - id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            rust:
              - 'crates/**'
              - 'Cargo.toml'
              - 'Cargo.lock'
              - '.sqlx/**'
              # Файлы, управляющие самой сборкой. Без них PR, меняющий пин
              # Rust или сам сторож, не запускал бы ни одной проверки —
              # сторожа не срабатывали бы ровно на тех изменениях, против
              # которых заведены.
              - 'mise.toml'
              - 'rust-toolchain.toml'
              - 'scripts/**'
              - '.github/workflows/**'

      - name: Установить тулчейн
        if: steps.changes.outputs.rust == 'true'
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # Версия самого mise закрепляется наравне с SHA экшенов: без неё
          # действует «последний релиз», и бинарь, исполняющий всю сборку,
          # оказывается единственным незакреплённым звеном. Отдельно важно
          # для MISE_TASK_RUN_AUTO_INSTALL выше — смена умолчания в новом
          # релизе молча вернула бы сборку sqlx-cli из исходников.
          version: 2026.8.3
          # Только rust. Backend cargo: собирает инструменты из исходников —
          # транзитивное дерево резолвится заново и build.rs исполняются на
          # раннере. Ни один шаг PR-1 не вызывает sqlx-cli, платить за эту
          # поверхность незачем.
          install_args: rust

      # rust-toolchain.toml объявляет components = ["rustfmt", "clippy"], но
      # mise ставит тулчейн через переменную RUSTUP_TOOLCHAIN, а она обходит
      # файл — components оттуда не читаются. На чистом раннере это первый же
      # красный шаг: «cargo-fmt is not installed for the toolchain 1.98.0».
      # Локально дефект не виден, потому что компоненты обычно уже стоят
      # системно — проверка на подготовленной машине принимает её состояние
      # за общее.
      - name: Компоненты тулчейна
        if: steps.changes.outputs.rust == 'true'
        run: rustup component add rustfmt clippy

      - name: Кэш cargo
        if: steps.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Пишем кэш только с main: иначе кэши веток вытесняют друг друга в
          # общем бюджете репозитория, и деградация проявляется молча —
          # полной пересборкой при неизменном lock-файле.
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Форматирование
        if: steps.changes.outputs.rust == 'true'
        run: mise run fmt:check

      - name: Clippy
        if: steps.changes.outputs.rust == 'true'
        run: mise run lint

      - name: Сборка
        if: steps.changes.outputs.rust == 'true'
        run: mise run build

      - name: Тесты
        if: steps.changes.outputs.rust == 'true'
        run: mise run test

      - name: Сторож чистоты графа hef-core
        if: steps.changes.outputs.rust == 'true'
        run: mise run guard:core-graph

      - name: Сторож отложенного prepare --check
        if: steps.changes.outputs.rust == 'true'
        run: mise run guard:sqlx-step

      - name: Сторож согласованности пина Rust
        if: steps.changes.outputs.rust == 'true'
        run: mise run guard:toolchain-pin

      # Проверка самих сторожей: каждый обязан уметь покраснеть. Ревью PR-1
      # нашло два сторожа, уже неспособных сработать, — оба прошли ручную
      # проверку. Здесь же сверяются два списка проверок: объявленный в
      # mise.toml и вызываемый этим workflow.
      - name: Сторожа способны краснеть
        if: steps.changes.outputs.rust == 'true'
        run: mise run guard:selftest

      # Шага `sqlx prepare --check` здесь НЕТ намеренно, а не по забывчивости.
      #
      # В PR-1 сторожить нечего: ни одного макроса query!, нет каталога .sqlx,
      # нет миграций. При этом prepare --check требует живого мигрированного
      # Postgres и DATABASE_URL — ресурса, которого нет ни в контейнере задачи
      # агента (ADR-0006: без docker и секретов БД), ни здесь без
      # service-контейнера.
      #
      # Сторож, который нельзя пройти честно, не строгий — он порождает обходы
      # (правку .sqlx руками, SQLX_OFFLINE=true в .env, уход с query! на
      # нетипизированный sqlx::query) и перекладывает работу на владельца.
      # См. docs/solutions/best-practices/storozh-protiv-nevozmozhnosti.md
      #
      # Шаг приходит вместе с первыми query! — одним изменением с
      # service-контейнером Postgres. Чтобы это не зависело от памяти, стоит
      # растяжка guard:sqlx-step выше: она краснеет, если query! появился, а
      # шага prepare --check всё ещё нет.

  front:
    name: front
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            front:
              - 'web/**'

      # Сборка фронта приходит в PR-2 вместе с dev-контуром и заменит это
      # предупреждение. Job завершается успешно — см. пояснение у infra.
      - name: Предупреждение о web/
        if: steps.changes.outputs.front == 'true'
        run: |
          echo "::warning::Каталог web/ изменён, но сборка фронта появится в PR-2."

  migrations:
    name: migrations
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            migrations:
              - 'crates/db/migrations/**'

      # Прогон миграций приходит вместе с v1-ядром схемы (следующий PR GF-5).
      - name: Предупреждение о миграциях
        if: steps.changes.outputs.migrations == 'true'
        run: |
          echo "::warning::Миграции изменены, но их прогон появится вместе с v1-ядром схемы."

  contract:
    name: contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            contract:
              - 'tests/contract/**'
              - 'crates/runner/**'
              - 'crates/fake-executor/**'
              - 'crates/core/**'
              # Бамп пина CLI гоняет контрактные тесты по построению —
              # ворота обновления образа исполнителя (ADR-0009).
              - 'infra/executor-image/**'

      - name: Установить тулчейн
        if: steps.changes.outputs.contract == 'true'
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          # Версия самого mise закрепляется наравне с SHA экшенов: без неё
          # действует «последний релиз», и бинарь, исполняющий всю сборку,
          # оказывается единственным незакреплённым звеном. Отдельно важно
          # для MISE_TASK_RUN_AUTO_INSTALL выше — смена умолчания в новом
          # релизе молча вернула бы сборку sqlx-cli из исходников.
          version: 2026.8.3
          install_args: rust

      - name: Кэш cargo
        if: steps.changes.outputs.contract == 'true'
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # Каталог tests/contract/ появляется вместе с первыми контрактными
      # тестами S3-S5. Пока их нет, прогоняем тесты затронутых крейтов.
      - name: Тесты крейтов контура
        if: steps.changes.outputs.contract == 'true'
        run: cargo test -p hef-core -p hef-runner -p hef-fake-executor --locked

  infra:
    name: infra
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - id: changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            infra:
              - 'infra/**'

      # Сборка образа приходит в PR-3 (= GF-6) и заменит это предупреждение.
      # Job завершается УСПЕШНО: его роль в PR-1 — существовать, чтобы имя
      # зарегистрировалось для required checks. Падение на изменении, которое
      # ещё не поддержано конструкцией, — блокировка, а не защита: у автора
      # легитимной правки (например бампа пина CLI в infra/executor-image,
      # ворота ADR-0009) не было бы честного пути до зелёного.
      - name: Предупреждение об infra/
        if: steps.changes.outputs.infra == 'true'
        run: |
          echo "::warning::Каталог infra/ изменён, но сборка образа появится в PR-3 (GF-6)."
